name: Windows build, full tests and portable package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VCPKG_DISABLE_METRICS: 1
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: dependencies-cache
        with:
          path: .cache/vcpkg
          key: windows-2022-x64-msvc-complete-v2-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            windows-2022-x64-msvc-complete-v2-
      - name: Prepare pinned vcpkg
        shell: pwsh
        run: |
          ./scripts/Bootstrap.ps1
          "VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV
      - name: Inspect build prerequisites
        shell: pwsh
        run: ./scripts/Test-Environment.ps1
      - name: Configure Windows x64
        run: cmake --preset windows-msvc
      - name: Preserve completely configured dependency builds
        if: steps.dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/vcpkg
          key: windows-2022-x64-msvc-complete-v2-${{ hashFiles('vcpkg.json') }}
      - name: Build Release
        run: cmake --build --preset release --parallel 2
      - name: Install verified upstream video tools for Release tests
        shell: pwsh
        run: ./scripts/Install-MediaTools.ps1 -Configuration Release
      - name: Test Release
        run: ctest --preset release
      - name: Build Debug
        run: cmake --build --preset debug --parallel 2
      - name: Install verified upstream video tools for Debug tests
        shell: pwsh
        run: ./scripts/Install-MediaTools.ps1 -Configuration Debug
      - name: Test Debug
        run: ctest --preset debug
      - name: Package clean Release and corresponding library source
        shell: pwsh
        run: ./scripts/Build-Portable.ps1 -RequireClean
      - name: Test extracted portable package with built-in Windows PowerShell
        shell: powershell
        run: |
          $version=[regex]::Match((Get-Content CMakeLists.txt -Raw),'project\(Downshift VERSION (\d+\.\d+\.\d+)').Groups[1].Value
          if(!$version){throw 'Missing product version.'}
          ./scripts/Test-Portable.ps1 -PackagePath "./build/releases/Downshift-$version-windows-x64.zip" -ReportPath ./build/releases/portable-test-report.json -TorrentTestDriver ./build/windows-msvc/Release/downshift_torrent_acceptance_tests.exe -PythonExecutable (Get-Command python).Source
      - name: Preserve verified distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Downshift-windows-x64
          path: build/releases/*.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
