<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Downshift</title><link rel="stylesheet" href="popup.css"></head><body>
<header><span class="mark">↓</span><div><h1>Downshift <small id="version"></small></h1><p>Your files, on your computer.</p></div></header>
<div class="connection"><span id="indicator"></span><strong id="connection">Checking connection…</strong></div>
<label class="toggle"><span>Use Downshift for downloads</span><input type="checkbox" id="enabled"></label>
<p class="note">Downloads open in Downshift, including generated files and downloads from signed-in pages. Choose the save location and manage progress in the app.</p>
<p id="notice" role="status"></p><p id="pending"></p>
<button id="open" class="primary">Open Downshift</button><button id="applyUpdate" hidden>Apply update, then refresh pages</button><button id="retry">Check connection / retry pending</button>
<p class="footer">Your files stay on this computer. Cookies stay in Chrome.</p>
<script type="module" src="popup.js"></script></body></html>
