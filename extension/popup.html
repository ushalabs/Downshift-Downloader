<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Downshift</title><link rel="stylesheet" href="popup.css"></head><body>
<header><span class="mark">↓</span><div><h1>Downshift</h1><p>Your files, on your computer.</p></div></header>
<div class="connection"><span id="indicator"></span><strong id="connection">Checking connection…</strong></div>
<label class="toggle"><span>Send supported downloads to Downshift</span><input type="checkbox" id="enabled"></label>
<p class="note">Public files with verified range support. Browser-only, private, executable, and tiny downloads stay in Chrome.</p>
<p id="notice" role="status"></p><p id="pending"></p>
<button id="open" class="primary">Open Downshift</button><button id="leave">Leave pending downloads in Chrome</button><button id="retry">Check connection / retry pending</button>
<p class="footer">Keep Downshift open for automatic handoff. No browsing data or cookies are collected.</p>
<script type="module" src="popup.js"></script></body></html>
